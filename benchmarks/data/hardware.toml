# Hardware profiles. One entry per distinct machine class.
# decode_bw_gbs is the *achieved* memory bandwidth of real single-stream MoE decode on this
# hardware, established by a clean no-speculation measurement (tok/s x active-GB-per-token).
# That, not the spec sheet, is what every roofline % in TABLE.md divides by.

[[hardware]]
id = "gb10"
name = "NVIDIA DGX Spark (GB10, Grace Blackwell)"
memory_gib = 121.69
memory_kind = "unified LPDDR5X, no separate VRAM, swap off"
spec_bw_gbs = 273.0
stream_copy_gbs = 245.6
decode_bw_gbs = 187.0
bf16_tflops = 250.0
notes = """
stream_copy_gbs: BabelStream cuda-stream Copy, 2026-08-19 (Dot 257.4). The 273 spec figure is not achievable.
decode_bw_gbs: 58.5 tok/s x 3.196 GB/token on a Q8_0 35B-A3B with no speculation = 187 GB/s = 76% of STREAM copy.
Batched vLLM/SGLang decode reaches ~85% of STREAM copy (see the Qwen3.6 rows), so 100% in the table means
"as good as llama.cpp single-stream", not "at the physical ceiling". Prefill runs at ~4% of BF16 peak on every engine.
Two-node cells use a single 200G QSFP56 DAC between two of these (NCCL busbw ~24 GB/s).
"""

