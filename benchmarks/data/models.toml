# Model *architectures*. A run points at one of these plus a concrete checkpoint string.
# params_active_b is what the roofline needs: bytes read per decoded token = active params x bytes/param.

[[model]]
id = "qwen3.6-35b-a3b"
name = "Qwen3.6-35B-A3B"
arch = "qwen3_5_moe hybrid linear+full attention, 40 layers, 256 experts top-8, 10 full-attention layers"
params_total_b = 35.0
params_active_b = 3.0
notes = "Active GB/token for this shape was computed exactly (dense + output head + experts x 8/256): Q8_0 3.196, NVFP4-experts 2.752, APEX mixed 2.393. Decensored (heretic) GGUF variants share the architecture."

[model.shape]
hidden = 2048
layers = 40
vocab = 248320
full_attention_layers = 10
n_heads = 16
n_kv_heads = 2
head_dim = 256
attn_output_gate = true
linear_attention = { key_heads = 16, key_head_dim = 128, value_heads = 32, value_head_dim = 128 }
moe = { n_experts = 256, top_k = 8, intermediate = 512, shared_intermediate = 512 }

