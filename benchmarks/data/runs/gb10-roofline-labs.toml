# Measured decode cells on DGX Spark (GB10), contributed by Roofline Labs from its lab notebook.
# One [[run]] per measurement. Field reference: SCHEMA.md. Sources are notebook entry dates.
#
# Conventions used here:
#   decode_tok_s            per-stream median at concurrency 1; aggregate at concurrency > 1
#   active_gb_per_token     bytes actually read per decoded token (GB, decimal)
#   active_gb_method        arch = computed from layer shapes; fraction = checkpoint_gb x active/total params; assumed = borrowed
#   speculation             none | draft-mtp (llama.cpp) | nextn (SGLang) | mtp (vLLM) | dflash | unknown
#   prefill_tok_s           at prefill_prompt_tokens (actual token count, not the nominal label)

